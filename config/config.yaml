# =============================================================================
# MCP Server Configuration
# =============================================================================
server:
    # IP address the server binds to at start-up
    host: "127.0.0.1"
    # The transport protocol used -- "http" or "stdio"
    transport: "http"
    # The port on host the MCP server binds to at start-up
    port: 8080
    # the home page of the "Calculator MCP" project
    homepage: "https://github.com/rubensgomes-org/calculator-mcp"

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message; plain if stderr is not a TTY or NO_COLOR
        # set environment variable NO_COLOR=true for plain text with no color.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        calculator_mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # FastMCP framework; replaces its default rich console handler
        fastmcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # FastMCP server (fastmcp/server/server.py)
        fastmcp.server.server:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # MCP protocol tracing — set to DEBUG to see full JSON-RPC messages
        mcp.client.streamable_http:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # HTTP request/response summaries — set to DEBUG for detail
        httpx:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: inbound JSON-RPC messages — set to DEBUG to see parsed requests
        mcp.server:
            level: DEBUG
            handlers:
                - console
            propagate: false
        mcp.server.lowlevel.server:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: StreamableHTTP transport — set to DEBUG for method-level tracing
        mcp.server.streamable_http:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: session/transport lifecycle — set to DEBUG for session details
        mcp.server.streamable_http_manager:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: startup, shutdown, and errors
        uvicorn:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: HTTP request lines (method, path, status)
        uvicorn.access:
            level: DEBUG
            handlers:
                - console
            propagate: false
    root:
        level: DEBUG
        handlers:
            - console
