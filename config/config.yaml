# =============================================================================
# MCP Server Configuration
# =============================================================================
server:
    # IP address the server binds to at start-up
    host: "127.0.0.1"
    # The transport protocol used -- "http" or "stdio"
    transport: "http"
    # The port on host the MCP server binds to at start-up
    port: 8080

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message; plain if stderr is not a TTY or NO_COLOR
        # set environment variable NO_COLOR=true for plain text with no color.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        #############################################################
        # ---------- >>> calculator_mcp <<< ------------------------#
        #############################################################
        calculator_mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> fastmcp <<< -------------------------------#
        #############################################################
        fastmcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        #############################################################
        # ---------- >>> mcp <<< -----------------------------------#
        #############################################################
        mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
#        # MCP — set to DEBUG to see full JSON-RPC messages
#        mcp.client.streamable_http:
#        # Server: inbound JSON-RPC messages — set to DEBUG to see parsed requests
#        mcp.server.lowlevel.server:
#        # Server: StreamableHTTP transport — set to DEBUG for method-level tracing
#        mcp.server.streamable_http:
#        # Server: session/transport lifecycle — set to DEBUG for session details
#        mcp.server.streamable_http_manager:
        #############################################################
        # ---------- >>> uvicorn <<< -------------------------------#
        #############################################################
        # Server: startup, shutdown, and errors
        uvicorn:
            level: DEBUG
            # 5 is TRACE for uvicorn
#            level: 5
            handlers:
                - console
            propagate: false
#        # Server: HTTP request lines (method, path, status)
#        uvicorn.access:
    root:
        level: WARNING
        handlers:
            - console
