# =============================================================================
# MCP Server Configuration
# =============================================================================
server:
    # IP address the server binds to at start-up
    # Use 0.0.0.0 when server is planeed to start from a container.
    host: "0.0.0.0"
    # The transport protocol used -- only http is supported
    transport: "http"
    # The port on host the MCP server binds to at start-up
    port: 8080
    # HTTP client timeout (seconds) to wait for a response from MCP server
    timeout: 10
    # Stateless HTTP mode (Modern Era, 2026-07-28 spec): true
    # Sateful HTTP mode (Legacy Era, 2025-06-18 spec): false
    stateless: true
    # the home page of the "Calculator MCP" project
    homepage: "https://github.com/rubensgomes-org/calculator-mcp"

# =============================================================================
# Client Configuration - used ONLY by this project client integration test
# =============================================================================
client:
    # Hosted, deployed and running for free at Prefect
    #   https://www.prefect.io/horizon
    url: "https://rubens-calculator-mcp.fastmcp.app/mcp"
    # Prefect requires OAuth authentication. Currently only Rubens is able
    # to authorize using his personal GitHub account.
    is_oauth: true
    # location to store OAuth token
    token_dir: "~/.calculator-mcp-token-remote"
    # local port temporarily used by the OAuth callback server during
    # OAuth handshaking.
    callback_port: 10101

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        # Colors level name and message; plain if stderr is not a TTY or NO_COLOR
        # set environment variable NO_COLOR=true for plain text with no color.
        standard:
            (): colorlog.ColoredFormatter
            fmt: "%(asctime)s %(log_color)s[%(levelname)s]%(reset)s %(fg_147)s%(name)s %(filename)s:%(lineno)d%(reset)s: %(log_color)s%(message)s%(reset)s"
            datefmt: "%H:%M:%S"
            log_colors:
                DEBUG: cyan
                INFO: light_green
                WARNING: yellow
                ERROR: red
                CRITICAL: bold_red
            stream: ext://sys.stderr
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        calculator_mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # FastMCP framework; replaces its default rich console handler
        fastmcp:
            level: INFO
            handlers:
                - console
            propagate: false
        # MCP protocol tracing — set to DEBUG to see full JSON-RPC messages
        mcp.client.streamable_http:
            level: INFO
            handlers:
                - console
            propagate: false
        # HTTP request/response summaries — set to DEBUG for detail
        httpx:
            level: INFO
            handlers:
                - console
            propagate: false
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: inbound JSON-RPC messages — set to DEBUG to see parsed requests
        mcp.server.lowlevel.server:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: StreamableHTTP transport — set to DEBUG for method-level tracing
        mcp.server.streamable_http:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: session/transport lifecycle — set to DEBUG for session details
        mcp.server.streamable_http_manager:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: startup, shutdown, and errors
        uvicorn:
            level: INFO
            handlers:
                - console
            propagate: false
        # Server: HTTP request lines (method, path, status)
        uvicorn.access:
            level: INFO
            handlers:
                - console
            propagate: false
    root:
        level: WARNING
        handlers:
            - console
