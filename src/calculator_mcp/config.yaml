# =============================================================================
# Server Configuration
# =============================================================================
server:
    # the home page of this project
    homepage: "https://github.com/rubensgomes-org/calculator-mcp"
    # MCP transport: "stdio" or "http"
    #
    # NOTES:
    # 1) I plan to have this MCP server running within an Azure Container
    # App (ACA) deployed into a CAE in a private VNet subnet.
    # 2) The ACA ingress port is provisioned as NON external facing.  That
    # is, ingress is only reachable within the CAE private VNet.
    # 3) The ACA ingress target port is 8080.  Therefore, this app MUST
    # be bound to port 8080 when to sync with the ACA ingress target port --
    # this is an Azure ACA requirement.
    # 4) The app must bound to the container NADDR_ANY "0.0.0.0" IP
    # address to allows the CAE ingress proxy to reach it
    #
    # http: for web services using the Streamable HTTP protocol
    transport: "http"
    # Host IP address for the HTTP/MCP server.
    #
    # The "0.0.0.0" is used because this application is meant to run from
    # within a Azure Container App container, which requires the wildcard
    # address or NADDR_ANY to accept HTTP connections
    # from outside the Docker container.
    # Use 127.0.0.1 to restrict the server to accept ingress from the
    # container itself localhost only.
    host: "0.0.0.0"
    # This port numbre must match the Azure Container Appp port provisioned
    # ingress target port, which current it is 8080.
    port: 8080
    # timeout in seconds
    timeout: 10
    # Stateless HTTP mode (Modern Era, 2026-07-28 spec): true drops session
    # affinity so each request carries its own protocol version and
    # capabilities in params._meta, enabling single-shot tool calls. Ignored
    # when transport is "stdio".
    stateless: true

# =============================================================================
# Client Configuration - used by this project local client integration test
# code to connect to live FastMCP server deployed for free at
# https://www.prefect.io/horizon.
# To run the client program:
#   poetry install
#   poetry run python tests/integration/client.py
# =============================================================================
client:
    # the URL the local integration test client should use to connect to
    # FastMCP server deployed and running at prefect.io/horizon servers.
    url: "https://rubens-calculator-mcp.fastmcp.app/mcp"
    # This FastMCP server deployed at prefect.io/horizon requires
    # OAuth authentication; therefore, is_ouath MUST be `true`
    # NOTE: For OAuth to work, you also need to export an environment
    # variable OAUTH_STORAGE_ENCRYPTION_KEY containing a secret key
    # (a Fernet key).
    is_oauth: true
    # A local folder that is used by OAuth to store secret information such
    # as an OAuth token
    token_dir: "~/.fastmcp"
    # fixed port for the OAuth callback server
    callback_port: 10000

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
    version: 1
    disable_existing_loggers: false
    formatters:
        standard:
            format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    handlers:
        console:
            class: logging.StreamHandler
            formatter: standard
            stream: ext://sys.stderr
    loggers:
        calculator_mcp:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # MCP protocol tracing — set to DEBUG to see full JSON-RPC messages
        mcp.client.streamable_http:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # HTTP request/response summaries — set to DEBUG for detail
        httpx:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # HTTP wire-level tracing (headers, TCP) — set to DEBUG for detail
        httpcore:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: inbound JSON-RPC messages — set to DEBUG to see parsed requests
        mcp.server.lowlevel.server:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: StreamableHTTP transport — set to DEBUG for method-level tracing
        mcp.server.streamable_http:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: session/transport lifecycle — set to DEBUG for session details
        mcp.server.streamable_http_manager:
            level: DEBUG
            handlers:
                - console
            propagate: false
        # Server: HTTP request lines (method, path, status)
        uvicorn.access:
            level: INFO
            handlers:
                - console
            propagate: false
    root:
        level: DEBUG
        handlers:
            - console
