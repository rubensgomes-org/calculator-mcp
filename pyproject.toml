[project]
# the name "calculator-mcp" was already taken at the public PyPI repo.
# Therefor, I had to add "-rubens" to the name below.
name = "calculator-mcp-rubens"
keywords = ["ai", "calculator", "math", "llm", "mcp", "utility"]
version = "0.0.52"
description = "A calculator MCP server using the FastMCP framework."
authors = [
    { name = "Rubens Gomes", email = "rubens.s.gomes@gmail.com" }
]
maintainers = [
  { name = "Rubens Gomes", email = "rubens.s.gomes@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0.0"
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    # Python versions supported.
    "Programming Language :: Python :: 3.14"
]
# runtime dependencies
dependencies = [
    "calculator-lib-rubens (>=0.2.5,<1)",
    "colorlog (>=6.12.0,<7)",
    "fastmcp (>=4.0.11,<5)",
    "mcp (>=2.3.0,<3)",
    "pydantic (>=2.13.5,<3)",
    "pyyaml (>=6.0.3,<7)",
    "starlette (>=1.7.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.5,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    # see more executable packages in the project documentation
    "black (>=26.10.0,<27)",
    "flake8 (>=7.4.1,<8)",
    "httpx2 (>=2.13.1,<3)",
    "isort (>=9.0.2,<10)",
    "mypy (>=1.20.2,<2)",
    "pip-audit (>=2.10.1,<3)",
    "poethepoet (>=0.48.0,<1)",
    "pylint (>=4.1.2,<5)",
    "pysonar (>=1.9.0.5762,<3)",
    "types-pyyaml (>=6.0.12.20260906,<7)",
    "uv (>=0.12.23,<1)",
]
test = [
    "coverage (>=7.16.2,<8)",
    "cryptography (>=50.0.2,<51)",
    "py-key-value-aio (>=0.4.6,<1)",
    "pytest (>=9.1.1,<10)",
    "pytest-asyncio (>=1.4.0,<2)",
    "pytest-cov (>=7.1.0,<8)",
]

[project.scripts]
calculator-mcp = "calculator_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/rubensgomes-org/calculator-mcp"
Documentation = "https://github.com/rubensgomes-org/calculator-mcp/blob/main/README.md"
Repository = "https://github.com/rubensgomes-org/calculator-mcp"

################################################################################
# ---------- >>> Tools <<< -----------------------------------------------------
################################################################################

[tool.black]
line-length = 80
target-version = ["py314"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.run]
source = ["calculator_mcp"]
branch = true

[tool.isort]
line_length = 80
profile = "black"

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true

[tool.poetry]
packages = [{ include = "calculator_mcp", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-report=xml"

[tool.sonar]
# SONAR_TOKEN must be defined as an environment variable
organization = "rubensgomes-org"
projectKey = "rubensgomes-org_calculator-mcp"
projectName = "calculator-mcp"
qualitygate.wait = true
sources = "src/"
sourceEncoding = "UTF-8"
python.version = "3.14"
python.coverage.reportPaths = "coverage.xml"

# ---------- >>> poethepoet tasks <<< -----------------------------------------

# To run a poe task:
# `poetry run poe <task-name>` OR
# `poe <task-name` (e.g., poe clean)

[tool.poe.tasks]
# Poe the Poetry "poethepoet" task runner needs to be installed.
# Define individual cleanup tasks
_clean_cache = "poetry cache clear --all"
_clean_misc = "rm -rf  .mypy_cache dist build"
_clean_pyc = "find . -name '*.pyc' -delete"
_clean_pycache = "find . -name '__pycache__' -type d -exec rm -rf {} +"
_clean_pytest = "rm -rf .pytest_cache"
_clean_venv = "poetry env remove --all"

# Combine them into one 'clean' command.  Similar to `make clean`
[tool.poe.tasks.clean]
sequence = [
    "_clean_cache",
    "_clean_misc",
    "_clean_pyc",
    "_clean_pycache",
    "_clean_pytest",
    "_clean_venv",
]
help = "Remove all project artifacts"
